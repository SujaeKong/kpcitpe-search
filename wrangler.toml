name = "kpcitpe-search"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# 사용자 정보 + 마케팅 동의 D1 DB
[[d1_databases]]
binding = "DB"
database_name = "kpcitpe-users"
database_id = "e4db547e-fb9f-4a42-a095-e259912bc429"

# 환경변수/시크릿은 Cloudflare 대시보드 또는 wrangler secret put 으로 등록.
# 향후 Phase A2에서 추가:
#   NAVER_CLIENT_ID
#   NAVER_CLIENT_SECRET
#   JWT_SECRET
#
# D1 (사용자 DB)는 Phase A3에서 [[d1_databases]] 추가.
