name: Split PDFs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: ['test', 'all']
        default: 'all'
      overwrite:
        description: '기존 분할 파일 덮어쓰기 (휴지통 이동 후 재업로드)'
        type: boolean
        default: false
      batch_offset:
        description: '시작 인덱스 (chunked 실행)'
        type: string
        default: '0'
      batch_limit:
        description: 'task 수 제한 (0=전체)'
        type: string
        default: '0'
      concurrency:
        description: '병렬 처리 개수'
        type: string
        default: '5'
      only:
        description: "task 좁히기 (예: '모의' 전체, '모의:종목별' 옛 회차 종목별 해설집만, '모의:회차=2011.07,2023.12'). 빈 값=전체"
        type: string
        default: ''
      keys:
        description: "매핑 키로 좁히기 (콤마 구분, 예: '기출/140/1_정보관리,합숙/2026.08/1일차_1교시'). sync가 신규 회차 자동 분할에 사용"
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: split-pdfs
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data (problems.json)
        run: npm run build:data

      - name: Run split-pdfs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
          SPLIT_MODE: ${{ inputs.mode || 'test' }}
          BATCH_OFFSET: ${{ inputs.batch_offset || '0' }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '0' }}
          CONCURRENCY: ${{ inputs.concurrency || '5' }}
          SPLIT_ONLY: ${{ inputs.only }}
          SPLIT_KEYS: ${{ inputs.keys }}
        run: npm run split:pdfs
        timeout-minutes: 350

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-result
          path: tmp-split/
          if-no-files-found: ignore

      - name: Commit & push mapping changes
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/mappings/explanation-files.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "매핑 변경 없음"
          else
            git config user.name "kpc-bot"
            git config user.email "kpc-bot@users.noreply.github.com"
            # 실행 중 다른 워크플로(sync/split)가 매핑을 커밋했을 수 있음 → rebase 대신
            # 최신 main 위에 분할 결과(tmp-split/split-result.json, gitignore)를 다시 머지해 충돌 없이 push
            pushed=false
            for i in 1 2 3; do
              git fetch -q origin main
              git reset -q --hard origin/main
              npm run -s split:merge
              if git diff --quiet -- data/mappings/explanation-files.json; then
                echo "최신 main에 이미 반영됨"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              git add data/mappings/explanation-files.json
              git commit -q -m "chore: split PDFs questions 매핑 갱신"
              if git push -q; then pushed=true; break; fi
              echo "push 실패, 최신 main에 재머지 후 재시도 ($i/3)"
            done
            [ "$pushed" = true ] || { echo "::error::매핑 push 3회 실패 — 산출물 split-result로 npm run split:merge 수동 복구"; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy (if changed)
        # GITHUB_TOKEN으로 push된 커밋은 deploy-cloudflare.yml의 push 트리거를
        # 발화시키지 않으므로 명시적으로 workflow_dispatch를 호출한다.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare.yml --ref main
