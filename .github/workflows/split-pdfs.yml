name: Split PDFs

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: '기존 분할 파일 덮어쓰기 (휴지통 이동 후 재업로드)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: split-pdfs
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data (problems.json)
        run: npm run build:data

      - name: Run split-pdfs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
        run: npm run split:pdfs

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-result
          path: tmp-split/
          if-no-files-found: ignore

      - name: Commit & push mapping changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/mappings/explanation-files.json; then
            echo "매핑 변경 없음"
          else
            git config user.name "kpc-bot"
            git config user.email "kpc-bot@users.noreply.github.com"
            git add data/mappings/explanation-files.json
            git commit -m "chore: split PDFs questions 매핑 갱신"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push 실패, pull --rebase 후 재시도 ($i/3)"
              git pull --rebase origin main
            done
          fi
