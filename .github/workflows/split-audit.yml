name: Split Alignment Audit

# 이미 분할된 해설지 전부를 통합 PDF로 다시 검사(검출 수·번호·제목 정렬). 읽기 전용 — 매핑·Drive를 바꾸지 않음.
# 결과(split-audit.json)에서 정렬 어긋남 후보를 확인해 통합본 폴백·재분할 금지를 결정한다.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "매핑 경로 접두어로 좁히기 (예: 기출, 모의/KPC/2016). 빈 값=전체"
        type: string
        default: ''
      concurrency:
        description: '병렬 다운로드 수'
        type: string
        default: '6'
      check:
        description: "검사 종류 — alignment(통합본 재검출) / content(분할본 내용 대조) / both"
        type: choice
        options: ['both', 'alignment', 'content']
        default: 'both'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build data (problems.json)
        run: npm run build:data

      # 통합본을 다시 재서 검출 수·번호·제목 정렬을 본다 (이미 올라간 분할본 파일은 읽지 않음)
      - name: Audit split alignment
        if: inputs.check != 'content'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUDIT_ONLY: ${{ inputs.only }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: npm run split:audit

      # 분할본 PDF를 실제로 읽어 연결된 엑셀 문항과 대조 (정렬 감사가 못 잡는 짝 어긋남)
      - name: Audit split content
        if: inputs.check != 'alignment'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUDIT_ONLY: ${{ inputs.only }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: npm run split:audit:content

      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-audit
          path: |
            tmp-split/split-audit.json
            tmp-split/split-content-audit.json
          if-no-files-found: warn
