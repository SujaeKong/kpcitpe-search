name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_link_drop:
        description: '해설지 연결 급감 허용 (의도한 폴백·회차 삭제 등)'
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  actions: write # 신규 회차 분할(split-pdfs) 트리거

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 로더 캐시 정책·API 게이트 회귀 테스트 (네트워크 없음). 실패 시 배포 중단.
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          SITE_URL: https://kpcitpe-search.pages.dev
          BASE_PATH: /
        run: npm run build

      # 빌드된 데이터 규칙 + 해설지 매핑 무결성(재분할 금지 회차, 재빌드 누락 등). 실패 시 배포 중단.
      - name: Data integrity tests
        run: npm run test:data

      # 운영 대비 해설지 연결·문항 수 급감 감지 (sync·매핑 버그로 대량 연결 끊김·회차 누락 방지). 실패 시 배포 중단.
      # 의도한 감소면 커밋 제목(첫 줄)에 [allow-link-drop] 또는 수동 실행 입력 allow_link_drop (본문 속 토큰은 무시)
      - name: Explanation link regression check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ALLOW_LINK_DROP_INPUT: ${{ inputs.allow_link_drop }}
        run: npm run check:links

      # 해설지 PDF를 엑셀보다 먼저 올린 회차 구제: 운영엔 문항이 없었는데 이번 빌드에서
      # 생긴, 아직 분할본이 없는 매핑 키를 찾아 둔다(배포 성공 후 split-pdfs에 넘김).
      # 운영 데이터와 비교해야 하므로 배포 **전에** 계산한다.
      - name: Detect rounds needing split
        id: pending
        run: echo "keys=$(npx -s tsx scripts/detect-pending-splits.ts)" >> "$GITHUB_OUTPUT"

      # /api/explanation 프록시가 Drive 파일(통합본+분할본)을 읽을 때 쓰는 서비스계정
      # 자격증명을 배포 직전에 Pages 런타임 시크릿으로 주입 (idempotent). 배포보다 먼저
      # 실행돼 새 배포가 곧바로 시크릿을 사용할 수 있게 함. GitHub 시크릿이 단일 출처.
      - name: Sync runtime secrets (Service Account → Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            | npx --yes wrangler@3.114.1 pages secret put GOOGLE_SERVICE_ACCOUNT_JSON --project-name=kpcitpe-search

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=kpcitpe-search --branch=main --commit-dirty=true

      # 운영 주소가 이번 빌드를 서빙할 때까지 대기: problems.json 내용 + index.html의 JS 번들 목록이
      # 방금 빌드한 dist와 같아지면 반영된 것으로 봄 (데이터만/코드만 바뀐 배포 모두 감지)
      - name: Wait for production to serve this build
        run: |
          set -uo pipefail
          SITE=https://kpcitpe-search.pages.dev
          want_js=$(grep -oE '/_astro/[^"]+\.js' dist/index.html | sort -u)
          for i in $(seq 1 24); do
            live_js=$(curl -sf "$SITE/" | grep -oE '/_astro/[^"]+\.js' | sort -u)
            if [ "$live_js" = "$want_js" ] && curl -sf "$SITE/data/problems.json" | cmp -s - dist/data/problems.json; then
              echo "운영 반영 확인 (${i}번째 확인)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::2분 안에 운영 주소에 이번 빌드가 반영되지 않음"
          exit 1

      # 운영 캐시 헤더·번들 반영·데이터(방금 빌드한 data/problems.json과 회차별 비교)·API 게이트 점검
      - name: Live tests
        run: npm run test:live

      # 엑셀이 늦게 올라와 분할을 못 했던 회차를 이제 분할 (배포가 끝난 뒤에 실행 —
      # split이 매핑을 커밋하면 그 커밋이 다음 배포를 부른다). 분할이 끝나면 해당 키에
      # questions가 생겨 다음 배포에서는 대상에서 빠지므로 반복되지 않는다.
      - name: Trigger split for newly added rounds
        if: steps.pending.outputs.keys != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS: ${{ steps.pending.outputs.keys }}
        run: |
          echo "신규 문항이 생긴 미분할 키 → 분할 트리거: $KEYS"
          gh workflow run split-pdfs.yml --ref main -f overwrite=false -f mode=all -f keys="$KEYS"
