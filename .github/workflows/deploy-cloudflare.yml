name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_URL: https://kpcitpe-search.pages.dev
          BASE_PATH: /
        run: npm run build

      # /api/explanation 프록시가 Drive 파일(통합본+분할본)을 읽을 때 쓰는 서비스계정
      # 자격증명을 배포 직전에 Pages 런타임 시크릿으로 주입 (idempotent). 배포보다 먼저
      # 실행돼 새 배포가 곧바로 시크릿을 사용할 수 있게 함. GitHub 시크릿이 단일 출처.
      - name: Sync runtime secrets (Service Account → Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            | npx --yes wrangler@3.114.1 pages secret put GOOGLE_SERVICE_ACCOUNT_JSON --project-name=kpcitpe-search

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=kpcitpe-search --branch=main --commit-dirty=true
