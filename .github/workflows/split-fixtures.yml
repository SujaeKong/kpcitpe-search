name: Split Signal Fixtures

# 분할 시그널 회귀 테스트용 픽스처 캡처 (본문을 가린 골격 텍스트). 산출물을 받아
# tests/fixtures/split-signals/에 커밋한다. 읽기 전용 — Drive·저장소에 쓰지 않음.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "매핑 경로(쉼표 구분, 예: 기출/138/1_정보관리,모의/KPC/2026.07/1). 빈 값=스크립트 기본 목록"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build data (problems.json)
        run: npm run build:data

      - name: Capture fixtures
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPLIT_FIXTURE_KEYS: ${{ inputs.keys }}
        run: npm run split:fixtures

      - name: Upload fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-fixtures
          path: tmp-split/fixtures/
          if-no-files-found: warn
