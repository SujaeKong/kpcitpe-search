name: Split PDFs (Debug)

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Drive 파일 id (빈 값이면 기본 샘플 PDF)'
        type: string
        default: ''
      pages:
        description: "출력할 페이지 범위 (예: 23-31, 빈 값이면 전체)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dump PDF text per page
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEBUG_FILE_ID: ${{ inputs.file_id }}
          DEBUG_PAGES: ${{ inputs.pages }}
        run: npm run split:debug
