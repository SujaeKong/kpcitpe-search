name: Sync Drive Mappings

on:
  schedule:
    # 매일 KST 03:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Actions 탭에서 수동 실행 가능

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync mappings from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: npm run sync:drive

      - name: Commit & push if changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/mappings/explanation-files.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git config user.name "kpc-bot"
            git config user.email "kpc-bot@users.noreply.github.com"
            git add data/mappings/explanation-files.json
            git commit -m "chore: auto-sync drive mappings"
            # remote가 앞서 있을 수 있어 pull --rebase 후 push 재시도
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "push 실패, pull --rebase 후 재시도 ($i/3)"
              git pull --rebase origin main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger split-pdfs (if changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run split-pdfs.yml --ref main -f overwrite=false

      - name: Trigger deploy (if changed)
        # GITHUB_TOKEN으로 push된 커밋은 deploy-cloudflare.yml의 push 트리거를
        # 발화시키지 않으므로(GitHub Actions 무한 루프 방지 정책), 명시적으로
        # workflow_dispatch를 호출해 배포를 트리거한다.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare.yml --ref main
