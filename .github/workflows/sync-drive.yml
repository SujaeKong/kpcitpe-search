name: Sync Drive Mappings

on:
  schedule:
    # 매일 KST 03:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Actions 탭에서 수동 실행 가능

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync mappings from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: npm run sync:drive

      - name: Commit & push if changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: |
          # sync는 내용이 같으면 $generatedAt도 유지하므로 diff가 없으면 진짜 변경 없음
          if git diff --quiet -- data/mappings/explanation-files.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
            exit 0
          fi
          git config user.name "kpc-bot"
          git config user.email "kpc-bot@users.noreply.github.com"
          # 실행 중 split 워크플로 등이 매핑을 커밋했으면 rebase는 $generatedAt 줄에서 충돌함 →
          # 최신 main으로 reset 후 sync를 다시 돌려(분할 정보는 fileId 기준 보존) 충돌 없이 push
          for i in 1 2 3; do
            git add data/mappings/explanation-files.json
            git commit -q -m "chore: auto-sync drive mappings"
            if git push -q; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 실패, 최신 main 위에서 sync 재실행 ($i/3)"
            git fetch -q origin main
            git reset -q --hard origin/main
            npm run -s sync:drive
            if git diff --quiet -- data/mappings/explanation-files.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "최신 main에 이미 반영됨"
              exit 0
            fi
          done
          echo "::error::매핑 push 3회 실패"
          exit 1

      - name: Trigger split-pdfs (if changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # mode=test 명시: 기본값 'all'은 questions 없는 옛 회차 548개를 전부 재분할해
        # 통합본 폴백한 정렬오류 회차들이 다시 어긋난 분할로 되살아남. TEST_SPECS만 처리.
        run: gh workflow run split-pdfs.yml --ref main -f overwrite=false -f mode=test

      - name: Trigger deploy (if changed)
        # GITHUB_TOKEN으로 push된 커밋은 deploy-cloudflare.yml의 push 트리거를
        # 발화시키지 않으므로(GitHub Actions 무한 루프 방지 정책), 명시적으로
        # workflow_dispatch를 호출해 배포를 트리거한다.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare.yml --ref main
